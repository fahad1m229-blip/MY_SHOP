services:
  - type: web
    name: my-shop-super-admin
    runtime: node
    rootDir: my-shop-admin/backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: COOKIE_SECURE
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0209162535
      - key: FIRESTORE_DATABASE_ID
        value: ai-studio-android-myshop-e9b08858-2004-4d98-a470-5851be985332
      - key: FIREBASE_STORAGE_BUCKET
        value: gen-lang-client-0209162535.firebasestorage.app
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_FRONTEND_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
